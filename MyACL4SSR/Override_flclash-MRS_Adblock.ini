  // 台湾节点-UDP转发-MRS去广告
  //--- 第一部分：台湾节点落地
  function main(config) {
if (!config.proxies || config.proxies.length === 0) return config;

  // 1. 寻找你的 DMIT 和 台湾节点
  let entryNode = config.proxies.find(p => p.name.includes("DMIT-LAX"));
  let exitNode = config.proxies.find(p => p.name.includes("bytevirt-TW"));

  if (entryNode && exitNode) {
    // 2. 深度复制台湾节点（不破坏原节点）
    let chainedNode = JSON.parse(JSON.stringify(exitNode));
    
    // 3. 给新节点起个显眼的名字
    chainedNode.name = "🔗 台湾中转链 (DMIT)";
    
    // 4. 注入核心中转代码
    chainedNode['dialer-proxy'] = entryNode.name;
    
    // 5. 把这个全新节点加入到总节点列表中
    config.proxies.push(chainedNode);
    
    // 6. 关键一步：把它加入到所有的策略组里，这样你才能在界面上选到它！
    if (config['proxy-groups']) {
      config['proxy-groups'].forEach(group => {
        // 如果这个组里原本就有节点列表，就把我们的新节点加进去
        if (group.proxies && Array.isArray(group.proxies)) {
          group.proxies.push(chainedNode.name);
        }
      });
    }
  }
    //---第二部分： 全局UDP转发和MRS去广告规则集
    // 1. 强制开启全局 UDP 转发和隐私保护
  config['udp'] = true;
  config['ipv6'] = false; // 彻底关闭 IPv6 防止“幽灵泄露”

  // 2. 强制启用 TUN 模式 (解决电报通话、游戏 UDP 无法连接的问题)
  config['tun'] = {
    'enable': true,
    'stack': 'gvisor',
    'dns-hijack': ['any:53'],
    'auto-route': true,
    'auto-detect-interface': true
  };

  // 3. 定义二进制 MRS 规则集 (高性能、省电)
  const providers = {
    'awavenue': {
      'type': 'http',
      'behavior': 'domain',
      'format': 'mrs',
      'url': 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs',
      'path': './ruleset/awavenue.mrs',
      'interval': 86400
    },
    'anti-ad': {
      'type': 'http',
      'behavior': 'domain',
      'format': 'mrs',
      'url': 'https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs',
      'path': './ruleset/anti-ad.mrs',
      'interval': 86400
    }
  };
  config['rule-providers'] = providers;

  // 4. 将拦截规则强行插入到所有规则的最前面
  const adsRules = [
    'RULE-SET,awavenue,REJECT',
    'RULE-SET,anti-ad,REJECT'
  ];
  config.rules = adsRules.concat(config.rules || []);

  return config;
}
