  // 全局UDP转发和MRS去广告规则集
function main(config) {
  // 1. 强制开启全局 UDP 转发和隐私保护
  config['udp'] = true;
  config['ipv6'] = false; // 彻底关闭 IPv6 防止“幽灵泄露”

  // 2. 强制启用 TUN 模式 (解决电报通话、游戏 UDP 无法连接的问题)
  config['tun'] = {
    'enable': true,
    'stack': 'gvisor',
    'dns-hijack': ['any:53'],
    'auto-route': true,
    'auto-detect-interface': true
  };

  // 3. 定义二进制 MRS 规则集 (高性能、省电)；第一个为秋风广告规则，第二个为anti-ad广告规则。
  const providers = {
    'awavenue': {
      'type': 'http',
      'behavior': 'domain',
      'format': 'mrs',
      'url': 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs',
      'path': './ruleset/awavenue.mrs',
      'interval': 86400
    },
    'anti-ad': {
      'type': 'http',
      'behavior': 'domain',
      'format': 'mrs',
      'url': 'https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs',
      'path': './ruleset/anti-ad.mrs',
      'interval': 86400
    }
  };
  config['rule-providers'] = providers;

  // 4. 将拦截规则强行插入到所有规则的最前面
  const adsRules = [
    'RULE-SET,awavenue,REJECT',
    'RULE-SET,anti-ad,REJECT'
  ];
  config.rules = adsRules.concat(config.rules || []);

  return config;
}
