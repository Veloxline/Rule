function main(config) {
  // 确保 rules 列表存在
  if (!config.rules) config.rules = [];

  // 1. 进程拦截 (ColorOS 系统搜索与底层追踪)
  const processRules = [
    "PROCESS-NAME,com.heytap.quicksearchbox,REJECT-DROP",
    "PROCESS-NAME,com.oplus.dmp,REJECT-DROP",
    "PROCESS-NAME,com.heytap.searchservice,REJECT-DROP"
  ];

  // 2. 域名拦截 (各类 App 广告与追踪器)
  const domainRules = [
    "DOMAIN,adx.ads.heytapmobi.com,REJECT-DROP",
    "DOMAIN,fclick.baidu.com,REJECT-DROP",
    "DOMAIN,ada.baidu.com,REJECT-DROP",
    "DOMAIN,t15.baidu.com,REJECT-DROP",
    "DOMAIN,googleads.g.doubleclick.net,REJECT-DROP",
    "DOMAIN,data.bilibili.com,REJECT-DROP",
    "DOMAIN,www.pangolin-dsp-toutiao.com,REJECT-DROP",
    "DOMAIN,spider-tracker.xiaohongshu.com,REJECT-DROP"
  ];

  // 批量将所有拦截规则强行插入到系统配置的最顶部
  config.rules.unshift(...processRules, ...domainRules);

  return config;
}
